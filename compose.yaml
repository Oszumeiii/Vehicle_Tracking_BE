# Docker's json-file logs grow without limit by default; keep about 50 MB per service.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

services:
  postgres:
    image: postgres:18-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: plate
      POSTGRES_DB: plate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - plate-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plate -d plate"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The whole stack in containers (docs/DOCKER.md): docker compose --profile app up --build
  # Without the profile only PostgreSQL starts, as start-all.cmd expects.
  api:
    profiles: [app]
    build: { context: ., target: api }
    # PLATE_IMAGE_PREFIX=ghcr.io/oszumeiii/ pulls the images CI publishes (docs/DEPLOY.md).
    image: ${PLATE_IMAGE_PREFIX:-}vehicle-tracking-api:${PLATE_IMAGE_TAG:-latest}
    logging: *logging
    env_file: .env
    environment: &app-env
      DATABASE_URL: postgresql://plate:${POSTGRES_PASSWORD}@postgres:5432/plate
      PLATE_DATA_DIR: /app/data
      PLATE_CACHE_DIR: /app/data/model-cache
      PLATE_PIPELINE_PYTHON: /opt/venv/bin/python
      PLATE_PIPELINES_CONFIG: config/pipelines.kaggle.json
      HOST: 0.0.0.0
      PORT: 3000
      # Requests reach the API through nginx (web) and maybe Caddy, all on the private
      # Docker network: trust those hops so req.ip is the real client (throttle, audit log).
      PLATE_TRUST_PROXY: loopback, uniquelocal
    volumes: &app-volumes
      - ./data:/app/data
      - ./models:/app/models:ro
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      # Ready means the database is reachable and fully migrated.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  worker:
    profiles: [app]
    build: { context: ., target: worker }
    image: ${PLATE_IMAGE_PREFIX:-}vehicle-tracking-worker:${PLATE_IMAGE_TAG:-latest}
    logging: *logging
    env_file: .env
    environment:
      <<: *app-env
      # Each job loads its own models (~3 GB RAM). Docker Desktop gives WSL 2 half the
      # host RAM by default, and two jobs at once ran out of memory on a 16 GB laptop.
      PLATE_WORKER_CONCURRENCY: 1
    volumes: *app-volumes
    depends_on:
      # The API migrates the database before it reports healthy.
      api: { condition: service_healthy }
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  web:
    profiles: [app]
    # Vehicle_Tracking_FE checked out next to this repository.
    build: { context: ../Vehicle_Tracking_FE }
    image: vehicle-tracking-web
    logging: *logging
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # pg_dump into data/backups every PLATE_BACKUP_HOURS (same folder and format as
  # start-all), keeping PLATE_BACKUP_DAYS days. Restore: docs/DEPLOY.md.
  backup:
    profiles: [app]
    image: postgres:18-alpine
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: plate
      PGDATABASE: plate
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${PLATE_BACKUP_DAYS:-14}
      EVERY_HOURS: ${PLATE_BACKUP_HOURS:-24}
    volumes:
      - ./data/backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/plate-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$f.part" && mv "$$f.part" "$$f"; then echo "backup $$f"
          else rm -f "$$f.part"; echo "backup failed" >&2; fi
          find /backups -name 'plate-*.dump' -mtime +$$KEEP_DAYS -delete
          sleep $$((EVERY_HOURS * 3600))
        done
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # HTTPS in front of web for a real domain: set PLATE_DOMAIN, point its DNS here and
  # open ports 80/443, then: docker compose --profile app --profile public up -d
  # Caddy gets and renews the Let's Encrypt certificate by itself (docs/DEPLOY.md).
  caddy:
    profiles: [public]
    image: caddy:2.10-alpine
    logging: *logging
    environment:
      PLATE_DOMAIN: ${PLATE_DOMAIN:-localhost}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Let's Encrypt needs the standard ports; others only suit a local test.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    depends_on:
      web: { condition: service_started }
    restart: unless-stopped

volumes:
  plate-postgres:
  caddy-data:
  caddy-config:
