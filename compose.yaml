services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: plate
      POSTGRES_DB: plate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - plate-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plate -d plate"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  plate-postgres:
