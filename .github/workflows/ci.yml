name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (build, format, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: plate
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: plate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plate -d plate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Each test file creates and drops its own database on this throwaway server.
      TEST_DATABASE_URL: postgresql://plate:ci-only-password@127.0.0.1:5432/plate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test

  python:
    name: Python (pytest, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      # The CPU build of the same torch release as the GPU machines (README).
      - run: pip install "torch==2.10.0" "torchvision==0.25.0" --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
